<wodle name="command">
  <disabled>no</disabled>
  <tag>nmap_network_scan</tag>
  <!-- Enter your target IP host or subnet here, e.g., 192.168.1.0/24 -->
  <command>/var/ossec/bin/nmap_scan.sh 192.168.0.60</command>
  <interval>1d</interval> <!-- Run once a day -->
  <ignore_output>yes</ignore_output>
  <run_on_start>yes</run_on_start>
  <timeout>1800</timeout> <!-- Execution timeout (30 min) -->
 </wodle>

 <localfile>
   <log_format>json</log_format>
   <location>/var/ossec/logs/nmap_scans.log</location>
</localfile>