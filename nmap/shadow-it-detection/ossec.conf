<wodle name="command">
   <disabled>no</disabled>
   <tag>nmap_shadow_it_detection</tag>
   <command>/var/ossec/bin/nmap_shadow_it.sh 192.168.0.0/24</command>
   <interval>1h</interval> <!-- Check every hour -->
   <ignore_output>yes</ignore_output>
   <run_on_start>yes</run_on_start>
   <timeout>600</timeout>
</wodle>

<localfile>
   <log_format>json</log_format>
   <location>/var/ossec/logs/nmap_shadow_it.log</location>
</localfile>